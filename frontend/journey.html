<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeDrop Local — La Historia Interactiva</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
/* ===== Fallback tokens (funciona incluso sin style.css) ===== */
:root{
  --bg-main:#070a12; --bg-card:rgba(15,22,36,.82); --bg-input:#151d2d;
  --border-color:rgba(203,213,225,.10);
  --primary:#3b82f6; --success:#10b981; --warning:#f59e0b; --danger:#ef4444;
  --text-main:#f8fafc; --text-muted:#a7b0c0; --text-dark:#566174;
  --font-sans:'Outfit',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
  /* Acentos por capítulo */
  --ch1:#3b82f6; --ch2:#94a3b8; --ch3:#a78bfa; --ch4:#10b981; --ch5:#ef4444;
  --accent:var(--ch1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-main);color:var(--text-main);font-family:var(--font-sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,select,textarea{font-family:inherit}
button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--accent) 45%,transparent) transparent}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--accent) 42%,transparent);border-radius:99px}

/* ===== Layout maestro ===== */
#journey-app{position:fixed;inset:0;display:flex;flex-direction:column;isolation:isolate;background:
  radial-gradient(circle at 42% -20%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 44%),var(--bg-main)}
#j-topbar{flex:none;height:68px;display:flex;align-items:center;gap:1rem;padding:0 1.35rem;
  background:linear-gradient(180deg,rgba(10,14,24,.96),rgba(8,12,21,.82));backdrop-filter:blur(18px) saturate(130%);
  border-bottom:1px solid var(--border-color);box-shadow:0 12px 36px rgba(0,0,0,.22);z-index:60}
#j-topbar .logo{display:flex;align-items:center;gap:.7rem;font-weight:800;font-size:1.07rem;color:var(--text-main);text-decoration:none;letter-spacing:-.015em}
#j-topbar .logo i{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;color:#dbeafe;
  background:linear-gradient(145deg,color-mix(in srgb,var(--primary) 90%,white 10%),#2455bf);box-shadow:0 0 24px rgba(59,130,246,.3)}
#j-topbar .logo span b{background:linear-gradient(90deg,#3b82f6,#10b981);-webkit-background-clip:text;background-clip:text;color:transparent}
#j-nav{display:flex;align-items:center;gap:.25rem;margin-left:auto;font-size:.82rem}
#j-nav a{color:var(--text-muted);text-decoration:none;transition:color .2s,background .2s,transform .2s;padding:.55rem .7rem;border-radius:10px}
#j-nav a:hover{color:var(--text-main);background:rgba(255,255,255,.045);transform:translateY(-1px)}
#j-nav a.active{color:var(--accent);font-weight:700;background:color-mix(in srgb,var(--accent) 10%,transparent)}
#j-badge{font-size:.68rem;font-family:var(--font-mono);padding:.34rem .7rem;border-radius:99px;border:1px solid var(--border-color);
  color:var(--text-muted);white-space:nowrap;background:rgba(255,255,255,.025)}
#j-badge.online{border-color:rgba(16,185,129,.4);color:var(--success)}

#j-main{flex:1;display:flex;min-height:0;position:relative}
#j-stage-wrap{flex:1;position:relative;min-width:0;overflow:hidden;background:
  radial-gradient(60vw 60vw at 8% 0%,color-mix(in srgb,var(--accent) 11%,transparent),transparent 68%),
  radial-gradient(48vw 48vw at 95% 100%,rgba(16,185,129,.055),transparent 70%),#080c15}
#j-stage-wrap::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.38;background-image:
  linear-gradient(rgba(148,163,184,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.045) 1px,transparent 1px);
  background-size:46px 46px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.78),transparent 92%)}
#j-stage-wrap::after{content:"";position:absolute;inset:0;z-index:30;pointer-events:none;box-shadow:inset 0 0 110px 28px rgba(3,6,13,.66)}
#j-stage{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;filter:saturate(1.08) contrast(1.025)}
#w-informante,#w-server,#w-custodios,#w-auditor,#w-chain{filter:drop-shadow(0 20px 24px rgba(0,0,0,.25))}

/* Breadcrumb de zoom */
#j-crumb{position:absolute;top:18px;left:20px;z-index:40;display:flex;gap:.4rem;align-items:center;
  font-size:.8rem;font-family:var(--font-mono);color:var(--text-muted);flex-wrap:wrap;max-width:60%}
#j-crumb button{background:rgba(10,15,26,.72);backdrop-filter:blur(12px);border:1px solid var(--border-color);color:var(--text-muted);
  border-radius:99px;padding:.4rem .75rem;cursor:pointer;font:inherit;transition:.2s;box-shadow:0 8px 22px rgba(0,0,0,.14)}
#j-crumb button:hover{color:var(--text-main);border-color:var(--accent)}
#j-crumb button.here{color:var(--accent);border-color:var(--accent);pointer-events:none}
#j-crumb .sep{opacity:.5}

/* Etiqueta de capítulo */
#j-chapterchip{position:absolute;top:18px;right:20px;z-index:40;font-size:.72rem;font-weight:800;letter-spacing:.095em;
  text-transform:uppercase;color:color-mix(in srgb,var(--accent) 82%,white);background:color-mix(in srgb,var(--accent) 10%,rgba(9,14,24,.9));
  border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);border-radius:99px;padding:.48rem .9rem;
  transition:color .5s,border-color .5s,background .5s;box-shadow:0 0 24px color-mix(in srgb,var(--accent) 12%,transparent)}

/* ===== Panel del narrador ===== */
#j-narrator{flex:none;width:420px;border-left:1px solid color-mix(in srgb,var(--accent) 20%,var(--border-color));
  background:linear-gradient(155deg,rgba(17,24,39,.94),rgba(9,14,24,.975));backdrop-filter:blur(18px) saturate(120%);
  display:flex;flex-direction:column;z-index:45;box-shadow:-28px 0 70px rgba(0,0,0,.3);position:relative;overflow:hidden}
#j-narrator::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;z-index:2;background:
  linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 22%,transparent));box-shadow:0 0 24px var(--accent)}
#j-narrator::after{content:"";position:absolute;width:260px;height:260px;right:-130px;top:-130px;border-radius:50%;pointer-events:none;
  background:color-mix(in srgb,var(--accent) 8%,transparent);filter:blur(12px);transition:background .5s}
#j-narr-head{padding:1.65rem 1.75rem 1.1rem;border-bottom:1px solid var(--border-color);position:relative;z-index:1}
#j-narr-kicker{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:800;transition:color .5s}
#j-narr-title{font-size:1.65rem;font-weight:800;letter-spacing:-.025em;line-height:1.16;margin:.48rem 0 .15rem;text-wrap:balance}
#j-narr-body{padding:1.35rem 1.75rem;overflow-y:auto;flex:1;font-size:1rem;line-height:1.72;color:#cbd3df;position:relative;z-index:1}
#j-narr-body b{color:var(--text-main)}
#j-narr-body .term{color:var(--accent);border-bottom:1px dashed var(--accent);cursor:help;font-weight:600}
#j-narr-body .beatnote{display:block;margin-top:1.15rem;padding:.85rem 1rem;border:1px solid color-mix(in srgb,var(--accent) 19%,var(--border-color));
  border-left:3px solid var(--accent);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 9%,transparent),rgba(255,255,255,.018));
  border-radius:0 12px 12px 0;font-size:.88rem;line-height:1.55;color:var(--text-muted)}
#j-narr-body .beatnote i{color:var(--accent);margin-right:.3rem}
#j-narr-action{padding:1rem 1.75rem 1.25rem;border-top:1px solid var(--border-color);position:relative;z-index:1;background:rgba(5,9,17,.3)}
#j-narr-action .cta{width:100%;min-height:52px;padding:.8rem .9rem .8rem 1.15rem;border-radius:14px;
  border:1px solid color-mix(in srgb,var(--accent) 72%,white 8%);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 82%,#111827),color-mix(in srgb,var(--accent) 58%,#080d18));
  color:#fff;font:inherit;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:.75rem;
  transition:transform .2s,filter .2s,box-shadow .2s;box-shadow:0 14px 28px color-mix(in srgb,var(--accent) 18%,transparent)}
#j-narr-action .cta i{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.13);transition:transform .2s}
#j-narr-action .cta:hover{filter:brightness(1.1);transform:translateY(-2px);box-shadow:0 18px 34px color-mix(in srgb,var(--accent) 25%,transparent)}
#j-narr-action .cta:hover i{transform:translateX(2px)}
#j-narr-action .cta[disabled]{opacity:.4;cursor:not-allowed}

/* Entrada del mensaje (cap.1) */
.j-input-msg{width:100%;min-height:84px;resize:vertical;background:var(--bg-input);color:var(--text-main);
  border:1px solid var(--border-color);border-radius:10px;padding:.7rem .8rem;font:inherit;font-size:.95rem;margin-top:.6rem}
.j-input-msg:focus{outline:none;border-color:var(--accent)}

/* ===== Barra de reproducción ===== */
#j-playbar{flex:none;height:88px;border-top:1px solid var(--border-color);background:linear-gradient(180deg,rgba(9,13,22,.94),rgba(6,9,16,.985));
  backdrop-filter:blur(18px);display:flex;align-items:center;gap:.8rem;padding:0 1.35rem;z-index:60;box-shadow:0 -18px 50px rgba(0,0,0,.24)}
.j-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--border-color);background:rgba(255,255,255,.035);
  color:var(--text-muted);cursor:pointer;font-size:.88rem;display:flex;align-items:center;justify-content:center;transition:.2s;flex:none}
.j-btn:hover{border-color:color-mix(in srgb,var(--accent) 60%,transparent);color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent);transform:translateY(-1px)}
.j-btn.primary{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 90%,white 8%),color-mix(in srgb,var(--accent) 72%,#070b14));
  border-color:var(--accent);color:#fff;width:48px;height:48px;border-radius:15px;font-size:1rem;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 25%,transparent)}
.j-btn.primary:hover{filter:brightness(1.15);color:#fff}
#j-speed{background:rgba(31,41,55,.6);border:1px solid var(--border-color);color:var(--text-muted);border-radius:8px;
  font:inherit;font-size:.8rem;padding:.35rem .5rem;cursor:pointer}
#j-timeline{flex:1;display:flex;gap:8px;height:48px;align-items:stretch;min-width:0;margin:0 .35rem}
.j-seg{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0;cursor:pointer;padding:.35rem .45rem .4rem;border-radius:10px;transition:background .25s}
.j-seg.active{background:color-mix(in srgb,var(--seg-color) 7%,transparent)}
.j-seg-label{font-size:.68rem;letter-spacing:.05em;color:var(--text-dark);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-transform:uppercase;font-weight:700;transition:color .3s}
.j-seg.active .j-seg-label{color:var(--seg-color)}
.j-seg-track{flex:1;display:flex;gap:3px}
.j-tick{flex:1;border-radius:99px;background:rgba(255,255,255,.075);position:relative;transition:background .3s,box-shadow .3s;min-width:4px}
.j-tick.done{background:color-mix(in srgb,var(--seg-color) 55%,transparent)}
.j-tick.now{background:var(--seg-color);box-shadow:0 0 10px var(--seg-color)}
.j-tick:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#111827;border:1px solid var(--border-color);color:var(--text-main);font-size:.72rem;padding:.35rem .6rem;
  border-radius:8px;white-space:nowrap;z-index:99;pointer-events:none}

/* ===== Minimapa ===== */
#j-minimap{position:absolute;bottom:18px;right:20px;width:196px;height:112px;z-index:40;border:1px solid var(--border-color);
  border-radius:14px;background:rgba(8,12,21,.78);backdrop-filter:blur(12px);overflow:hidden;cursor:pointer;
  transition:border-color .3s,transform .3s,box-shadow .3s;box-shadow:0 18px 42px rgba(0,0,0,.28)}
#j-minimap:hover{border-color:var(--accent)}
#j-minimap:hover{transform:translateY(-2px);box-shadow:0 22px 48px rgba(0,0,0,.36)}
#j-minimap svg{width:100%;height:100%;display:block}
#j-mini-cam{fill:none;stroke:var(--accent);stroke-width:26;opacity:.9;transition:stroke .4s}
#j-minimap .hint{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:.62rem;color:var(--text-dark);font-family:var(--font-mono)}

/* ===== Lente de detalle (Nivel 2 en HTML legible) ===== */
#j-lens{position:absolute;inset:0;z-index:35;display:none;align-items:center;justify-content:center;padding:76px 40px 34px;
  pointer-events:none;background:radial-gradient(circle at center,color-mix(in srgb,var(--accent) 5%,transparent),rgba(3,6,12,.34) 75%)}
#j-lens.on{display:flex}
#j-lens .lens-card{pointer-events:auto;max-width:790px;width:100%;max-height:100%;overflow-y:auto;position:relative;
  background:linear-gradient(145deg,rgba(18,25,40,.975),rgba(8,13,23,.97));
  border:1px solid color-mix(in srgb,var(--accent) 42%,var(--border-color));border-radius:20px;padding:1.65rem 1.8rem;
  box-shadow:0 30px 90px rgba(0,0,0,.62),0 0 60px color-mix(in srgb,var(--accent) 11%,transparent)}
#j-lens .lens-card::before{content:"";position:absolute;left:1.8rem;right:1.8rem;top:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 18px var(--accent)}
.lens-title{font-size:1.14rem;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:.7rem;margin:0 0 1rem;color:var(--text-main)}
.lens-title i{color:var(--accent)}
.hexrow{display:flex;gap:.8rem;align-items:baseline;font-family:var(--font-mono);font-size:.86rem;padding:.5rem .2rem;
  border-bottom:1px dashed rgba(255,255,255,.07)}
.hexrow .k{color:var(--text-muted);min-width:190px;flex:none;font-size:.78rem}
.hexrow .v{color:var(--text-main);word-break:break-all;cursor:pointer}
.hexrow .v.trunc{color:var(--accent)}
.hexrow .v.trunc:hover{text-decoration:underline}
.lens-note{margin-top:1rem;font-size:.88rem;color:var(--text-muted);line-height:1.55}
.lens-actions{margin-top:1.1rem;display:flex;gap:.7rem;flex-wrap:wrap}
.lens-btn{padding:.6rem 1rem;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);
  font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;transition:.2s}
.lens-btn:hover{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.lens-btn.solid{background:var(--accent);color:#fff}
.lens-err{margin-top:.8rem;font-family:var(--font-mono);font-size:.82rem;color:var(--danger);
  background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:.7rem .9rem;display:none;white-space:pre-wrap}

/* Animación XOR / Matrix */
.gcm-line{display:flex;flex-wrap:wrap;gap:4px;font-family:var(--font-mono);font-size:1.05rem;margin:.4rem 0 1rem}
.gcm-ch{width:26px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:6px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:.25s;perspective:200px}
.gcm-ch.flip{background:rgba(59,130,246,.15);border-color:var(--accent);color:var(--accent);transform:rotateX(360deg)}
.gcm-math{font-family:var(--font-mono);font-size:.92rem;background:rgba(255,255,255,.04);border:1px solid var(--border-color);
  border-radius:10px;padding:.8rem 1rem;line-height:1.9}
.gcm-math .hl{color:var(--accent);font-weight:700}
.gcm-math .ok{color:var(--success);font-weight:700}

/* Shares (cap 3/4) */
.share-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem;margin:.6rem 0 1rem}
.share-card{border:1px solid rgba(167,139,250,.35);background:rgba(167,139,250,.06);border-radius:14px;padding:.9rem;
  text-align:center;cursor:pointer;transition:.25s;position:relative}
.share-card i{font-size:1.5rem;color:#a78bfa;display:block;margin-bottom:.4rem}
.share-card .sid{font-weight:800;font-size:.95rem}
.share-card .shex{font-family:var(--font-mono);font-size:.68rem;color:var(--text-muted);word-break:break-all;margin-top:.35rem;max-height:44px;overflow:hidden}
.share-card.loaded{border-color:var(--success);background:rgba(16,185,129,.1)}
.share-card.loaded::after{content:'✓ cargado en RAM';position:absolute;top:.4rem;right:.6rem;font-size:.62rem;color:var(--success);font-family:var(--font-mono)}
.share-card.disabled{opacity:.35;pointer-events:none}

/* Gráfica Lagrange */
#lagrange-svg{width:100%;height:300px;background:rgba(255,255,255,.02);border:1px solid var(--border-color);border-radius:12px}
.lg-toggles{display:flex;gap:.6rem;margin:.7rem 0}
.lg-tg{flex:1;padding:.5rem;border-radius:10px;border:1px solid rgba(167,139,250,.35);background:transparent;color:var(--text-muted);
  font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;transition:.2s}
.lg-tg.on{background:rgba(167,139,250,.18);color:#c4b5fd;border-color:#a78bfa}
.lg-verdict{font-size:.9rem;font-weight:700;text-align:center;padding:.55rem;border-radius:10px;margin-top:.2rem}
.lg-verdict.no{background:rgba(239,68,68,.09);color:#fca5a5}
.lg-verdict.yes{background:rgba(16,185,129,.1);color:#6ee7b7}

/* Bitácora / logs (cap 2 y 5) */
.log-list{display:flex;flex-direction:column;gap:.45rem;margin:.5rem 0 1rem;max-height:280px;overflow-y:auto}
.log-item{display:flex;gap:.8rem;align-items:center;border:1px solid var(--border-color);border-radius:10px;
  padding:.55rem .8rem;font-size:.82rem;cursor:pointer;transition:.2s;background:rgba(255,255,255,.02)}
.log-item:hover{border-color:var(--accent)}
.log-item .lid{font-family:var(--font-mono);color:var(--text-dark);flex:none}
.log-item .lact{font-weight:700;flex:none;min-width:150px}
.log-item .ldet{color:var(--text-muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-item .lhash{font-family:var(--font-mono);font-size:.68rem;color:var(--text-dark);flex:none}
.log-item.sel{border-color:var(--danger);background:rgba(239,68,68,.07)}
.log-item.corrupt{border-color:var(--danger);background:rgba(239,68,68,.12);animation:pulse-red 1.2s infinite}
.log-item.okv{border-color:rgba(16,185,129,.5)}
.log-item.tainted{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.05)}
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 rgba(239,68,68,.0)}50%{box-shadow:0 0 18px rgba(239,68,68,.45)}}
.hash-cmp{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin-top:.6rem}
.hash-cmp .col{background:rgba(255,255,255,.03);border:1px solid var(--border-color);border-radius:12px;padding:.8rem}
.hash-cmp h5{margin:0 0 .5rem;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.hash-chars{font-family:var(--font-mono);font-size:.8rem;word-break:break-all;line-height:1.7}
.hash-chars span.bad{color:var(--danger);background:rgba(239,68,68,.15);border-radius:3px}
.hash-chars span.good{color:var(--success)}

/* Panel Modo Ingeniero */
#j-eng{position:absolute;left:20px;bottom:18px;z-index:40;width:420px;max-height:44%;display:none;flex-direction:column;
  background:rgba(7,10,18,.94);backdrop-filter:blur(14px);border:1px solid rgba(59,130,246,.3);border-radius:14px;overflow:hidden;
  box-shadow:0 20px 55px rgba(0,0,0,.4)}
#j-eng.on{display:flex}
#j-eng header{padding:.55rem .9rem;font-size:.75rem;font-family:var(--font-mono);color:var(--primary);
  border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;background:transparent}
#j-eng pre{margin:0;padding: .8rem .95rem;overflow:auto;font-family:var(--font-mono);font-size:.74rem;line-height:1.6;color:#c9d4e5}
#j-eng pre .cm{color:#64748b}#j-eng pre .st{color:#86efac}#j-eng pre .kw{color:#93c5fd}
#j-engtoggle{position:absolute;left:20px;bottom:18px;z-index:39}
.pill-toggle{background:rgba(17,24,39,.85);border:1px solid var(--border-color);color:var(--text-muted);border-radius:99px;
  padding:.45rem .95rem;font:inherit;font-size:.78rem;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:.5rem}
.pill-toggle:hover{color:var(--text-main);border-color:var(--primary)}

const hex = b => [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const enc = new TextEncoder(), dec = new TextDecoder();
async function sha256(str){ return hex(await crypto.subtle.digest("SHA-256", enc.encode(str))); }

/* GF(256) — mismo polinomio 0x11d que backend/crypto_utils.py */
function gfMul(a,b){let p=0;for(let i=0;i<8;i++){if(b&1)p^=a;const c=a&0x80;a=(a<<1)&0x1ff;if(c)a^=0x11d;b>>=1;}return p&0xff;}
function gfPow(a,n){let r=1;while(n>0){if(n&1)r=gfMul(r,a);a=gfMul(a,a);n>>=1;}return r;}
const gfInv = a => gfPow(a,254);
function sssSplit(bytes){ // k=2, n=3 — réplica de split_secret_shamir
  const shares={1:[],2:[],3:[]}, rnd=new Uint8Array(bytes.length); crypto.getRandomValues(rnd);
  bytes.forEach((S,i)=>{const a1=rnd[i]; for(const x of [1,2,3]) shares[x].push(S ^ gfMul(a1,x));});
  const out={}; for(const x of [1,2,3]) out[x]=`SD-SHARE-v1-${x}-${b64(new Uint8Array(shares[x]))}`;
  return out;
}
function sssCombine(shareA, shareB){ // interpolación de Lagrange en x=0 con 2 puntos
  const parse=s=>{const p=s.split("-"); return {x:+p[3], y:Uint8Array.from(atob(p.slice(4).join("-")),c=>c.charCodeAt(0))};};
  const A=parse(shareA), B=parse(shareB);
  // l_A(0) = x_B / (x_B ⊕ x_A) ; l_B(0) = x_A / (x_A ⊕ x_B)   (resta = XOR en GF(256))
  const lA=gfMul(B.x, gfInv(A.x^B.x)), lB=gfMul(A.x, gfInv(A.x^B.x));
  const out=new Uint8Array(A.y.length);
  for(let i=0;i<out.length;i++) out[i]=gfMul(A.y[i],lA)^gfMul(B.y[i],lB);
  return out;
}

/* Pipeline completo, se recalcula cuando cambia el mensaje */
const K = { msg:"He detectado anomalías fiscales en el sector 3.", attachedFile: "evidencia.pdf", ready:false };
async function runPipeline(){
  K.ready=false;
  // 1. Par RSA-OAEP 2048 de la organización (efímero para la demo)
  if(!K.rsa){
    K.rsa = await crypto.subtle.generateKey({name:"RSA-OAEP",modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:"SHA-256"},true,["encrypt","decrypt"]);
    K.pubSpki = await crypto.subtle.exportKey("spki", K.rsa.publicKey);
    K.privPkcs8 = new Uint8Array(await crypto.subtle.exportKey("pkcs8", K.rsa.privateKey));
    K.shares = sssSplit(K.privPkcs8);                    // Shamir 2-of-3 sobre la llave privada REAL
  }
  // 2. Llave AES-GCM 256 + IV de 12 bytes
  K.aes = await crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt","decrypt"]);
  K.aesRaw = new Uint8Array(await crypto.subtle.exportKey("raw",K.aes));
  K.iv = crypto.getRandomValues(new Uint8Array(12));
  // 3. Cifrado del reporte (los últimos 16 bytes del resultado son el tag GCM)
  K.cipher = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:K.iv}, K.aes, enc.encode(K.msg)));
  K.tag = K.cipher.slice(-16);

  // 3b. Cifrado de archivos adjuntos (si se seleccionó uno)
  if (K.attachedFile !== "none") {
    K.fileIv = crypto.getRandomValues(new Uint8Array(12));
    const fileContent = K.attachedFile === "evidencia.pdf" ?
      "[PDF: Evidencia de desvíos de fondos por $240,000 en el sector 3. Firmado por gerente.]" :
      "[JPG: Captura de pantalla de transferencia de fondos no autorizada en el portal bancario.]";
    K.fileCipher = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:K.fileIv}, K.aes, enc.encode(fileContent)));
    K.fileTag = K.fileCipher.slice(-16);
  } else {
    K.fileIv = null; K.fileCipher = null; K.fileTag = null;
  }

  // 4. Envoltura RSA-OAEP de la llave AES
  K.wrapped = new Uint8Array(await crypto.subtle.encrypt({name:"RSA-OAEP"}, K.rsa.publicKey, K.aesRaw));
  K.payload = { report_text_encrypted:b64(K.cipher), report_iv:b64(K.iv), encrypted_aes_key:b64(K.wrapped) };
  if (K.attachedFile !== "none") {
    K.payload.file_name = K.attachedFile;
    K.payload.file_iv = b64(K.fileIv);
    K.payload.file_data_encrypted = b64(K.fileCipher);
  }
  K.ready=true;
}
/* Descifrado del capítulo 4 — usa la llave reconstruida por Shamir, no la original */
async function auditorDecrypt(shareIds){
  const rebuilt = sssCombine(K.shares[shareIds[0]], K.shares[shareIds[1]]);
  K.rebuiltOk = rebuilt.length===K.privPkcs8.length && rebuilt.every((v,i)=>v===K.privPkcs8[i]);
  const priv = await crypto.subtle.importKey("pkcs8",rebuilt,{name:"RSA-OAEP",hash:"SHA-256"},false,["decrypt"]);
  const aesRaw = await crypto.subtle.decrypt({name:"RSA-OAEP"},priv,K.wrapped);
  const aes = await crypto.subtle.importKey("raw",aesRaw,{name:"AES-GCM"},false,["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM",iv:K.iv},aes,K.cipher);
  const plainText = dec.decode(plain);
  
  if (K.attachedFile !== "none" && K.fileCipher) {
    const plainFile = await crypto.subtle.decrypt({name:"AES-GCM",iv:K.fileIv},aes,K.fileCipher);
    K.decryptedFile = dec.decode(plainFile);
  } else {
    K.decryptedFile = null;
  }
  return plainText;
}

/* Bitácora encadenada — misma fórmula que database.compute_log_hash */
const CHAIN = { logs:[], corruptIdx:-1 };
async function buildChain(){
  const seed=[["SYSTEM_INIT","sistema","Base de datos inicializada"],["USER_LOGIN","auditor","Inicio de sesión JWT válido"],
    ["REPORT_SUBMITTED","anónimo","Reporte #1 recibido (cifrado)"],["REPORT_VIEWED","auditor","Auditor consultó reporte #1"],
    ["USER_LOGIN","admin","Inicio de sesión JWT válido"],["INTEGRITY_CHECK","admin","Verificación de bitácora: OK"]];
  CHAIN.logs=[]; CHAIN.corruptIdx=-1; let prev="0".repeat(64);
  for(let i=0;i<seed.length;i++){
    const [action,user,details]=seed[i], ts=new Date(Date.now()-(seed.length-i)*3.6e6).toISOString();
    const h=await sha256(`${i+1}|${ts}|${action}|${user}|${details}|${prev}`);
    CHAIN.logs.push({id:i+1,ts,action,user,details,prev,hash:h}); prev=h;
  }
}
async function recomputeHash(l){ return sha256(`${l.id}|${l.ts}|${l.action}|${l.user}|${l.details}|${l.prev}`); }
async function verifyChain(){ // réplica de verify_audit_trail_integrity
  let prev="0".repeat(64); const res=[];
  for(const l of CHAIN.logs){
    const expected=await recomputeHash({...l,prev});
    const ok = expected===l.hash && l.prev===prev;
    res.push({id:l.id, ok, tainted:res.some(r=>!r.ok)}); prev=l.hash;
  }
  return res;
}

/* Glosario */
const GLOSSARY = {
  "AES-GCM":"Cifrado simétrico autenticado. Además de ocultar los datos, produce un <b>tag</b> de 16 bytes: si un solo bit del ciphertext cambia, el descifrado falla. Es la 'C' y parte de la 'I' de la tríada CIA.",
  "IV":"Vector de Inicialización: 12 bytes aleatorios que garantizan que el mismo mensaje cifrado dos veces produzca resultados distintos. No es secreto, pero jamás debe repetirse con la misma llave.",
  "RSA-OAEP":"Cifrado asimétrico con padding aleatorio (OAEP + MGF1/SHA-256). Se usa solo para envolver la pequeña llave AES: cifrar el reporte entero con RSA sería lentísimo.",
  "TLS":"La capa de transporte cifrada (HTTPS). Aquí es la pared <b>exterior</b>: aunque se rompiera, dentro viaja otro cifrado que el servidor tampoco puede abrir.",
  "JWT":"JSON Web Token: credencial firmada que prueba el rol (auditor/admin) ante la API. Autoriza <b>pedir</b> datos, pero no sirve para descifrarlos.",
  "Shamir":"Shamir's Secret Sharing: divide un secreto en n fragmentos de los que cualquier subconjunto de k lo reconstruye, y k−1 no revelan absolutamente nada. Aquí: k=2, n=3, byte a byte en GF(256).",
  "GF(256)":"Campo de Galois de 256 elementos (polinomio 0x11d). Permite hacer la aritmética de Shamir con bytes exactos: la suma es XOR y la división siempre existe.",
  "SHA-256":"Función hash: resume cualquier dato en 256 bits. Cambiar una letra de la entrada cambia ~la mitad de los bits de salida (efecto avalancha), lo que hace visible cualquier manipulación.",
  "Zero-Knowledge":"Arquitectura de conocimiento cero: el servidor presta servicio (guardar, listar, entregar) sin poder conocer jamás el contenido. La confidencialidad deja de depender de la buena fe del administrador.",
  "Argon2id":"Algoritmo de hashing de contraseñas ganador de la Password Hashing Competition; resistente a fuerza bruta con GPU/ASIC. Protege las credenciales de admin y auditor.",
  "OAEP":"Optimal Asymmetric Encryption Padding: mezcla la llave AES con bytes aleatorios (semilla + máscaras MGF1) antes de la exponenciación RSA, dando seguridad semántica contra ataques de texto elegido."
};

    $("#tam-edit").style.display="block"; $("#tam-text").value=CHAIN.logs[sel].details;
  });
  $("#tam-go").onclick=async()=>{
    if(sel<0)return;
    CHAIN.logs[sel].details=$("#tam-text").value||CHAIN.logs[sel].details+" [ALTERADO]";
    CHAIN.corruptIdx=sel; CHAIN.verifyCache=null;
    const v=$("#tam-verdict"); v.style.display="block"; v.className="lg-verdict yes";
    v.innerHTML=`Registro #${sel+1} sobrescrito. El campo <b>details</b> cambió… pero el <b>hash almacenado sigue siendo el antiguo</b>. Continúa para ver la matemática delatarlo.`;
    $$("#tam-list .log-item")[sel].classList.add("corrupt");
    $("#j-cta").disabled=false;
    renderWorld(stateAt(cur));
  };
}
async function ensureTampered(){ if(CHAIN.corruptIdx>=0) return;
  CHAIN.corruptIdx=2; CHAIN.logs[2].details+=" — [ALTERADO POR EL ATACANTE]"; CHAIN.verifyCache=null; }
async function panelHashCompare(){
  await ensureTampered();
  const l=CHAIN.logs[CHAIN.corruptIdx];
  const fresh=await recomputeHash(l);
  const paint=(a,b)=>[...a].map((c,i)=>`<span class="${c===b[i]?"good":"bad"}">${c}</span>`).join("");
  return `<h4 class="lens-title"><i class="fa-solid fa-magnifying-glass"></i> El dato miente; el hash no</h4>
  <p class="lens-note" style="margin-top:0">Registro #${l.id}: el atacante cambió el contenido pero no puede cambiar la matemática. Comparación carácter a carácter:</p>
  <div class="hash-cmp">
    <div class="col"><h5>Hash almacenado (forjado con el dato original)</h5><div class="hash-chars">${paint(l.hash,fresh)}</div></div>
    <div class="col"><h5>Hash recalculado ahora (con el dato alterado)</h5><div class="hash-chars">${paint(fresh,l.hash)}</div></div>
  </div>
  <p class="lens-note">Efecto avalancha de ${T("SHA-256")}: un cambio mínimo en la entrada altera ~50% de los bits. Los dos valores no se parecen en nada — y esa divergencia es la firma del crimen.</p>`;
}
function panelRewriteAll(){
  return `<h4 class="lens-title"><i class="fa-solid fa-circle-question"></i> "¿Y si el atacante recalcula TODA la cadena?"</h4>
  <div class="gcm-math">para ocultar el eslabón #k debe re-forjar: hash(k), hash(k+1), … hash(n)<br>
  → reescritura <span class="hl">total y consistente</span> de la tabla audit_logs</div>
  <p class="lens-note">Es posible en teoría — y por eso este diseño se defiende en capas: la verificación compara la cadena completa contra su propia consistencia y contra los respaldos previos; cualquier re-forja masiva diverge del último backup íntegro. En producción, el README propone además <b>anclar la cabeza de la cadena fuera del sistema</b> (multi-custodio / KMS externo), volviendo la reescritura detectable siempre. Ser honestos con este límite es parte del rigor del proyecto.</p>`;
}
function panelDefenses(){
  const d=[["fa-lock","TLS 1.3 en tránsito","nadie escucha la red"],["fa-user-shield","Argon2id en credenciales","fuerza bruta inviable"],
    ["fa-cube","Cifrado híbrido en reposo","la DB es ilegible"],["fa-id-badge","RBAC con JWT","cada rol, su puerta"],

  return `<h4 class="lens-title"><i class="fa-solid fa-shield-halved"></i> Defensa en profundidad: las 5 murallas</h4>
  <div class="log-list" style="max-height:none">${d.map((x,i)=>`<div class="log-item okv defense-ring" style="opacity:0" data-d="${i}">
    <i class="fa-solid ${x[0]}" style="color:var(--success);width:22px;text-align:center"></i>
    <span class="lact" style="min-width:220px">${x[1]}</span><span class="ldet">${x[2]}</span></div>`).join("")}</div>

/* ---------- 8. LOS BEATS (guion completo, 5 capítulos) ---------- */
function defineBeats(){
  const B=[];
  const add=o=>B.push(o);

  /* ===== CAPÍTULO 1 — El Nacimiento del Secreto ===== */
  add({ch:1,n:1,title:"María tiene un secreto",zoom:"world",state:{accent:"--ch1"},
    text:`Este es el mundo de SafeDrop. A la izquierda, <b>María</b>, una empleada que detectó un fraude. Al centro, un servidor que promete no leer nada. A la derecha, el único navegador autorizado a leer. Arriba, tres custodios. Abajo, más tarde, un atacante.<br><br>María va a reportar el fraude <b>sin que nadie — ni siquiera el sistema — pueda saber quién es ni qué dijo</b>. Sigamos a su mensaje.`,
    note:"Usa ←/→, la barra inferior o el botón Continuar. El minimapa (abajo a la derecha) siempre te trae de vuelta a esta vista.",
    enter(){ if(REDUCED)return; gsap.fromTo("#w-informante",{opacity:.2},{opacity:1,duration:1});
      gsap.fromTo("#j-chapterchip",{y:-8,opacity:0},{y:0,opacity:1,duration:.5}); }});
  add({ch:1,n:2,title:"Todo empieza — y casi todo termina — aquí dentro",zoom:"informante",state:{msg:true},
    text:`Hacemos zoom al navegador de María. Escribe su denuncia en el formulario de <b>index.html</b>. Fíjate en el candado: el contexto es HTTPS, requisito para que exista <b>window.crypto.subtle</b>, la API criptográfica nativa.<br><br><b>Edita el mensaje si quieres</b> — toda la historia usará TU texto, cifrado con criptografía real:<textarea class="j-input-msg" id="msg-input">${esc(K.msg)}</textarea>
    <div style="margin-top:.7rem">
      <label style="display:block; font-size:.78rem; font-weight:700; color:var(--text-muted); margin-bottom:.2rem"><i class="fa-solid fa-paperclip" style="color:var(--accent)"></i> Adjuntar Evidencia (PDF/Foto):</label>
      <select class="j-input-msg" id="file-input" style="min-height:38px; margin-top:2px; padding:.3rem .5rem; font-size:.9rem">
        <option value="evidencia.pdf" ${K.attachedFile==="evidencia.pdf"?"selected":""}>evidencia.pdf (124 KB)</option>
        <option value="contrato_corrupto.jpg" ${K.attachedFile==="contrato_corrupto.jpg"?"selected":""}>contrato_corrupto.jpg (2.1 MB)</option>
        <option value="none" ${K.attachedFile==="none"?"selected":""}>— Sin archivo adjunto —</option>
      </select>
    </div>`,
    note:"Nada ha salido del navegador todavía. El texto plano de la tarjeta blanca solo existirá en dos pantallas en todo el universo.",
    eng:()=>({file:"frontend/index.html · contexto seguro",body:`<span class="cm">// Web Crypto exige HTTPS:</span>\n<span class="kw">if</span> (!window.isSecureContext) {\n  <span class="cm">// crypto.subtle === undefined</span>\n}\n<span class="cm">// por eso run.py genera certs X.509\n// autofirmados (backend/ssl_gen.py)</span>`}),
    enter(){
      const t=$("#msg-input"), f=$("#file-input");
      if(!t) return; let deb;
      const update=()=> {
        clearTimeout(deb);

  add({ch:1,n:3,title:"Nace una llave que nadie más verá",zoom:"informante",state:{aesKey:true,ivChip:true},lens:true,lensName:"Material criptográfico",
    text:`El navegador tira los dados cuánticos: <b>32 bytes</b> del generador criptográficamente seguro se convierten en una llave ${T("AES-GCM")} de un solo uso, junto a un ${T("IV")} de 12 bytes.<br><br>Los valores del panel central son <b>reales</b>: tu navegador acaba de generarlos.`,
    eng:()=>({file:"frontend/js/crypto_client.js",body:`<span class="kw">const</span> aesKey = <span class="kw">await</span> crypto.subtle.generateKey(\n  { name: <span class="st">"AES-GCM"</span>, length: <span class="st">256</span> },\n  <span class="kw">true</span>, [<span class="st">"encrypt"</span>]\n);\n<span class="kw">const</span> iv = crypto.getRandomValues(<span class="kw">new</span> Uint8Array(<span class="st">12</span>));`}),
    enter(){ openLens(panelKeyMaterial());
      if(!REDUCED){gsap.fromTo("#w-aeskey",{scale:.3,rotation:-180,transformOrigin:"center"},{scale:1,rotation:0,duration:.9,ease:"back.out(1.6)"});
      gsap.fromTo("#w-iv",{x:30,opacity:0},{x:0,opacity:1,duration:.6,delay:.4});} }});
  add({ch:1,n:4,title:"El mensaje se disuelve en ruido — con sello",zoom:"informante",state:{encrypted:true},lens:true,lensName:"Bloques AES-GCM",dur:9000,
    text:`Zoom máximo: dentro del cifrado. ${T("AES-GCM")} genera un <b>keystream</b> y lo mezcla con tu mensaje vía XOR, carácter por carácter. Al final estampa un <b>tag de 16 bytes</b>: un sello de lacre matemático.<br><br>Si mañana alguien altera un solo bit del ciphertext, el sello no coincidirá y el descifrado se negará por completo.`,
    eng:()=>({file:"payload real (P ⊕ C = keystream)",body:`ciphertext[0..8] = <span class="st">${hex(K.cipher.slice(0,9))}</span>\ntag GCM        = <span class="st">${hex(K.tag)}</span>\n<span class="cm">// el tag autentica ciphertext + IV:\n// integridad dentro del propio cifrado</span>`}),
    enter(){ openLens(panelGCM()); animateGCM();
      if(!REDUCED) gsap.fromTo("#w-brick-inf",{opacity:0,scale:.7,transformOrigin:"245px 400px"},{opacity:1,scale:1,duration:.7,delay:1.2}); }});
  add({ch:1,n:5,title:"La llave entra en una caja que María no puede reabrir",zoom:"informante",state:{wrapped:true},lens:true,lensName:"Envoltura RSA-OAEP",
    text:`Queda un problema: la llave AES también viajará. Se protege envolviéndola con ${T("RSA-OAEP")} usando la <b>llave pública</b> de la organización (endpoint <b>/api/crypto/public-key</b>).<br><br>Es un buzón de un solo sentido: cualquiera puede depositar, pero ni siquiera María puede volver a abrirlo. Solo la llave privada — que pronto veremos romperse en tres — podrá.`,
    eng:()=>({file:"frontend/js/crypto_client.js",body:`<span class="kw">const</span> wrapped = <span class="kw">await</span> crypto.subtle.encrypt(\n  { name: <span class="st">"RSA-OAEP"</span> },   <span class="cm">// MGF1 + SHA-256</span>\n  orgPublicKey,\n  rawAesKey            <span class="cm">// 32 bytes</span>\n);\n<span class="cm">// resultado: ${K.wrapped.length} bytes</span>`}),
    enter(){ openLens(panelOAEP());
      if(!REDUCED) gsap.fromTo("#w-wrap",{scale:.85,opacity:0,transformOrigin:"243px 240px"},{scale:1,opacity:1,duration:.7,ease:"back.out(1.5)"}); }});
  add({ch:1,n:6,title:"El viaje: un túnel con doble pared",zoom:"tls",state:{packet:1,spySees:true},dur:8000,
    text:`El paquete <b>{ciphertext, IV, llave envuelta}</b> parte hacia <b>POST /api/reports/submit</b> por el túnel ${T("TLS")}.<br><br>Observa al espía con su lupa en medio de la red: si rompiera la pared exterior (TLS), dentro encontraría… más cifrado. La denuncia viaja con <b>doble pared</b>, y la interior no la abre ni el propio servidor de destino.`,
    note:"Verificable en el proyecto real: F12 → pestaña Red → el body del POST solo contiene base64 cifrado. Ni una letra en claro.",

    enter(){ const pk=$("#w-packet"); gsap.set(pk,{opacity:1});

      gsap.to("#w-tls-path",{strokeDashoffset:-200,duration:3,repeat:-1,ease:"none"}); }});
  add({ch:1,n:7,title:"Entrega ciega completada",zoom:"world",state:{packet:0,dbBricks:1,chain:3},
    text:`El paquete cae en <b>safedrop.db</b> como un ladrillo opaco, y la bitácora suelda un nuevo eslabón: <b>REPORT_SUBMITTED</b>.<br><br>María cierra su navegador. Su llave AES se esfuma con la pestaña; su identidad nunca existió en el sistema. Fin del primer acto — ahora entremos al servidor a comprobar que de verdad es ciego.`,
    cta:"Entrar al servidor →",
    enter(){ if(REDUCED)return;

  /* ===== CAPÍTULO 2 — El Guardián Ciego ===== */
  add({ch:2,n:1,title:"Lo que el servidor realmente guarda",zoom:"server",state:{accent:"--ch2"},lens:true,lensName:"Fila SQLite",
    text:`Dentro de la sala de máquinas: FastAPI recibió el paquete y SQLAlchemy lo archivó tal cual. El panel muestra la fila <b>exacta</b> de la tabla, con el base64 real de tu mensaje.<br><br>Nota el ojo tachado sobre el rack: es una decisión de arquitectura, no una política. Esto es ${T("Zero-Knowledge","arquitectura de conocimiento cero")}.`,

    enter(){ openLens(panelSQLiteRow()); [0,1,2].forEach(i=>gsap.to(`#w-led-${i}`,{fill:"#10b981",duration:.2,delay:.3*i,yoyo:true,repeat:3})); }});
  add({ch:2,n:2,title:"Ponte el sombrero negro: intenta leerlo",zoom:"server",lens:true,lensName:"Prueba de fuerza",interactive:true,
    text:`No nos creas: <b>compruébalo</b>. Imagina que robaste la base de datos completa. En el panel hay un botón que intenta descifrar el blob con una llave aleatoria, usando la API criptográfica de verdad.<br><br>Ejecútalo y lee el error con calma: es el mismo muro contra el que chocaría cualquier administrador curioso, técnico de soporte o atacante.`,

  add({ch:2,n:3,title:"Mientras tanto, la bitácora suelda eslabones",zoom:"chain",state:{chain:4},lens:true,lensName:"Forja de un eslabón",
    text:`Cada acción del sistema — un login, un reporte, una consulta — se registra en la bitácora. Pero no como texto suelto: cada registro incluye el <b>hash del anterior</b> dentro de su propio hash ${T("SHA-256")}.<br><br>Los eslabones quedan soldados en orden. Guarda esta imagen: esta cadena será la heroína del capítulo final.`,

  add({ch:2,n:4,title:"Los datos duermen cifrados. ¿Quién puede despertarlos?",zoom:"world",
    text:`Vista completa: el reporte reposa como ladrillo ilegible, la cadena crece, el servidor sirve sin ver. La confidencialidad y la integridad están en pie.<br><br>Pero toda historia de cifrado esconde la misma pregunta: <b>¿dónde vive la llave que lo abre todo?</b> Para responderla hay que rebobinar al día cero.`,

    enter(){ if(!REDUCED) gsap.to("#w-privkey",{opacity:.35,duration:.5,yoyo:true,repeat:5}); }});

    eng:()=>({file:"backend/crypto_utils.py · gf256_mul()",body:`<span class="cm"># polinomio irreducible 0x11d — idéntico aquí en JS</span>\n<span class="kw">def</span> gf256_mul(a, b):\n    p = 0\n    <span class="kw">for</span> _ <span class="kw">in</span> range(8):\n        <span class="kw">if</span> b & 1: p ^= a\n        carry = a & 0x80\n        a <<= 1\n        <span class="kw">if</span> carry: a ^= 0x11d\n        b >>= 1\n    <span class="kw">return</span> p & 0xff`}),

  add({ch:3,n:3,title:"Tres gemas, tres custodios — y una trituradora",zoom:"custodios",state:{shares:true,privShred:true},dur:8000,
    text:`Cada byte se reparte y nacen tres archivos <b>SD-SHARE-v1-*</b> que vuelan a custodios independientes: un USB, una caja fuerte, un tercero de confianza.<br><br>Y entonces, el gesto más importante del diseño: <b>la llave privada original se destruye</b>. A partir de este segundo, la llave maestra no existe entera en ningún lugar del planeta.`,

  add({ch:3,n:4,title:"¿Qué combinaciones abren la bóveda?",zoom:"custodios",lens:true,lensName:"Umbral 2-de-3",

  add({ch:3,n:5,title:"El mapa, ahora con satélites",zoom:"world",

  /* ===== CAPÍTULO 4 — El Ritual del Auditor ===== */
  add({ch:4,n:1,title:"Primero, la puerta: el JWT",zoom:"auditor",state:{accent:"--ch4",brickAud:true},lens:true,lensName:"Credencial JWT",
    text:`El auditor inicia sesión (contraseña protegida con ${T("Argon2id")}) y recibe un ${T("JWT")} con su rol. Con él pide <b>GET /api/reports/1</b>… y el servidor le entrega, obedientemente, <b>el ladrillo cifrado</b>.<br><br>Punto clave para la sustentación: la <b>autorización</b> (RBAC) y la <b>capacidad de descifrar</b> son poderes separados. El token abre puertas; no abre candados.`,
    eng:()=>({file:"backend/main.py · get_report_detail()",body:`<span class="cm"># requiere rol auditor (JWT válido)…</span>\n<span class="kw">return</span> {\n  <span class="st">"report_text_encrypted"</span>: r.report_text_encrypted,\n  <span class="st">"report_iv"</span>: r.report_iv,\n  <span class="st">"encrypted_aes_key"</span>: r.encrypted_aes_key\n}\n<span class="cm"># …y aun así solo entrega blobs</span>`}),

      if(!REDUCED) gsap.fromTo("#w-privkey-aud",{opacity:0,scale:.4,transformOrigin:"1420px 407px"},{opacity:1,scale:1,duration:.8,delay:.5}); }});
  add({ch:4,n:4,title:"Se abre la caja: cae la llave dorada",zoom:"auditor",state:{aesAud:true},
    text:`La llave privada reconstruida abre la envoltura ${T("RSA-OAEP")} — la misma animación del capítulo 1, en reversa — y de la caja cae la <b>llave AES dorada</b> que María generó y que nadie más había visto desde entonces.<br><br>Queda el último paso: usarla contra el ladrillo.`,

  add({ch:4,n:5,title:"El mensaje regresa — con el sello intacto",zoom:"auditor",state:{msgAud:true},lens:true,lensName:"Texto descifrado",
    text:`AES-GCM descifra y, en el mismo acto, <b>verifica el tag</b>: nadie tocó el ciphertext en tránsito ni en reposo. El texto que lee el auditor es, garantizado por matemática, el que María escribió.<br><br>Cuenta los lugares donde existió el texto plano: dos navegadores. El servidor orquestó todo el viaje sin ver una sola letra.`,
    eng:()=>({file:"descifrado 100% en el cliente",body:`<span class="kw">await</span> crypto.subtle.decrypt({name:<span class="st">"RSA-OAEP"</span>}, privKey, wrapped)\n<span class="kw">await</span> crypto.subtle.decrypt({name:<span class="st">"AES-GCM"</span>, iv}, aesKey, cipher)\n<span class="cm">// si el tag no cuadra: OperationError\n// (integridad y confidencialidad juntas)</span>`}),
    enter(){ openLens(panelPlainResult()); }});
  add({ch:4,n:6,title:"El ritual termina: las llaves se desvanecen",zoom:"auditor",state:{privAud:false,aesAud:false},
    text:`Al cerrar el reporte, las referencias a las llaves se liberan y el recolector de basura hace el resto: la llave privada vuelve a <b>no existir</b>. Sin archivos temporales, sin caché, sin rastro.<br><br>El sistema regresa a su estado más seguro: secretos repartidos, datos cifrados, servidor ciego. Demasiado perfecto… hagamos que alguien intente romperlo.`,
    cta:"Provocar el ataque →",
    enter(){ if(!REDUCED){["#w-privkey-aud","#w-aeskey-aud"].forEach(s=>gsap.fromTo(s,{opacity:1},{opacity:0,scale:.3,duration:1,ease:"power2.in"}));} }});

  /* ===== CAPÍTULO 5 — El Ataque y la Cadena ===== */
  add({ch:5,n:1,title:"El peor escenario: el enemigo ya está adentro",zoom:"world",state:{accent:"--ch5",attacker:true,chain:6},
    text:`Cambia la luz. Aparece el <b>admin malicioso</b>: no necesita romper TLS ni adivinar contraseñas — tiene acceso directo al archivo <b>safedrop.db</b>. Los reportes no le preocupan a él… le preocupa <b>la bitácora</b>, que registró algo que quiere borrar de la historia.<br><br>Este es el ataque que el botón "Simular Ataque DB" de <b>admin.html</b> reproduce. Aquí, el atacante serás tú.`,
    enter(){ if(!REDUCED) gsap.fromTo("#w-attacker",{opacity:0,y:30},{opacity:1,y:0,duration:.9}); }});
  add({ch:5,n:2,title:"Manos al teclado: reescribe la historia",zoom:"attacker",lens:true,lensName:"Editor del atacante",interactive:true,lockCta:true,
    text:`Tienes la tabla <b>audit_logs</b> abierta con permisos de escritura. <b>Elige cualquier eslabón y reescribe su contenido</b> — cámbiale el usuario, el detalle, lo que quieras — y sobrescribe la fila.<br><br>Fíjate en el detalle criminal: puedes cambiar el dato, pero el hash almacenado junto a él fue forjado con el dato <b>original</b>.`,

  add({ch:5,n:4,title:"El dato miente; el hash no",zoom:"chain",state:{attackLine:true},lens:true,lensName:"Comparación de hashes",dur:9000,
    text:`Pantalla dividida: a la izquierda, el hash <b>almacenado</b> (forjado con el dato original); a la derecha, el hash <b>recalculado ahora</b> con el dato que alteraste.<br><br>El efecto avalancha de ${T("SHA-256")} hace que difieran en casi todos los caracteres. El atacante dejó el equivalente criptográfico de una huella dactilar gigante.`,
    async enter(){ openLens(await panelHashCompare()); }});
  add({ch:5,n:5,title:'"¿Y si recalcula toda la cadena?" — la pregunta inteligente',zoom:"chain",lens:true,lensName:"Límites y honestidad",
    text:`Anticipémonos a la mejor pregunta del jurado. Re-forjar la cadena completa es teóricamente posible para quien controla la DB — por eso el diseño responde en capas: consistencia total verificada, respaldos íntegros para comparar, y la mejora propuesta en el README de <b>anclar la cabeza de la cadena fuera del sistema</b>.<br><br>Reconocer el límite exacto de cada defensa es lo que separa la ingeniería de seguridad del marketing.`,
    enter(){ openLens(panelRewriteAll()); }});
  add({ch:5,n:6,title:"Verificación: el pulso que recorre la cadena",zoom:"chain",state:{verify:"run"},dur:10000,
    text:`El administrador legítimo pulsa <b>Verificar Integridad</b>. Un pulso recorre la cadena eslabón por eslabón, recalculando cada hash…<br><br>…hasta chocar con tu alteración: <b>⛓️‍💥 CADENA COMPROMETIDA</b>. El eslabón corrupto se marca en rojo y todos los posteriores quedan en cuarentena (ámbar): su pasado ya no es confiable. El incidente pasa al plan de respuesta: aislar la DB y restaurar el último respaldo íntegro.`,
    eng:()=>({file:"backend/database.py · verify_audit_trail_integrity()",body:`<span class="kw">for</span> log <span class="kw">in</span> logs:\n    expected = compute_log_hash(..., prev_hash)\n    <span class="kw">if</span> expected != log.current_hash:\n        <span class="kw">return</span> <span class="st">False</span>, log.id  <span class="cm"># ⛓️‍💥</span>\n    prev_hash = log.current_hash`}),
    async enter(){ await ensureTampered();
      CHAIN.verifyCache = await verifyChain();
      const myBeat = cur;
      renderChain(6, null);
      // pulso: pinta el veredicto real de cada eslabón, en orden, hasta chocar con el corrupto
      for(let i=0;i<6;i++){
        await new Promise(r=>setTimeout(r, REDUCED?40:650));
        if(cur!==myBeat) return; // el usuario navegó a otro beat
        const partial = CHAIN.verifyCache.map((v,j)=> j<=i ? v : null);
        renderChain(6, partial);
        if(!CHAIN.verifyCache[i].ok){
          if(!REDUCED) gsap.fromTo("#w-chain",{x:-4},{x:4,duration:.06,repeat:9,yoyo:true,onComplete:()=>gsap.set("#w-chain",{x:0})});
          await new Promise(r=>setTimeout(r, REDUCED?40:900));
          break;
        }
      }
      if(cur===myBeat) renderChain(6, CHAIN.verifyCache); }});
  add({ch:5,n:7,title:"Las cinco murallas",zoom:"world",lens:true,lensName:"Defensa en profundidad",
    text:`Cierre. Repasa lo que atravesamos: TLS que ciega la red, Argon2id que blinda las puertas, cifrado híbrido que vuelve ilegible el reposo, RBAC que separa poderes, y Shamir que evapora la llave maestra.<br><br>SafeDrop Local convierte la protección del denunciante en lo único que ninguna presión, soborno o descuido puede revocar: <b>una restricción matemática</b>.`,
    cta:"Reiniciar la historia",
    enter(){ openLens(panelDefenses());
      $$(".defense-ring").forEach((d,i)=>gsap.to(d,{opacity:1,duration:.5,delay:REDUCED?0:.45*i})); }});

  // numerar beats dentro de su capítulo
  const count={};
  B.forEach(b=>{count[b.ch]=(count[b.ch]||0)+1; b.n=count[b.ch];});

}
